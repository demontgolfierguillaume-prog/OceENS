name: Architecture Check

on:
  push:
  pull_request:

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install the project from uv.lock
        run: uv sync --locked

      - name: Check package boundaries
        run: uv run tach check

      - name: Check package cycles
        run: uv run python scripts/check_cycles.py
